[package]
name = "copse-site"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Navigator", "Clipboard", "HtmlElement", "Document", "Element", "Location", "DomRect", "MediaQueryList"] }

# Smallest WebAssembly for visitors to download: about a third smaller than
# the default release settings (264 KB to 175 KB, compressed).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
